name: Build rolling latest release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rolling-latest-release
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\CodingAgentAccountSwitcher.sln
          dotnet restore .\src\CodingAgentAccountSwitcher.App\CodingAgentAccountSwitcher.App.csproj `
            --runtime win-x64

      - name: Test
        run: dotnet test CodingAgentAccountSwitcher.sln --configuration Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish .\src\CodingAgentAccountSwitcher.App\CodingAgentAccountSwitcher.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output .\artifacts\publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            -p:Version=0.1.${{ github.run_number }}

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          Copy-Item -LiteralPath .\LICENSE -Destination .\artifacts\publish\LICENSE -Force
          $assetPath = '.\artifacts\coding-agent-account-switcher-win-x64.zip'
          if (Test-Path -LiteralPath $assetPath) {
            Remove-Item -LiteralPath $assetPath -Force
          }
          Compress-Archive `
            -Path .\artifacts\publish\* `
            -DestinationPath $assetPath `
            -CompressionLevel Optimal

          $checksumPath = '.\artifacts\coding-agent-account-switcher-win-x64.zip.sha256'
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *coding-agent-account-switcher-win-x64.zip" |
            Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Replace rolling latest release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_PATH: .\artifacts\coding-agent-account-switcher-win-x64.zip
          CHECKSUM_PATH: .\artifacts\coding-agent-account-switcher-win-x64.zip.sha256
        run: |
          # Do not probe expected absence through a failing API request. Newer
          # PowerShell runners may promote native stderr to a terminating error.
          $releaseListJson = gh release list --limit 100 --json tagName
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to list existing releases.'
          }

          $hasLatestRelease = @(
            $releaseListJson |
              ConvertFrom-Json |
              Where-Object { $_.tagName -eq 'latest' }
          ).Count -gt 0

          if ($hasLatestRelease) {
            gh release delete latest --cleanup-tag --yes
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to delete the previous latest release.'
            }
          }
          else {
            $latestTagReference = git ls-remote --tags origin refs/tags/latest
            if ($LASTEXITCODE -ne 0) {
              throw 'Failed to check for an orphan latest tag.'
            }

            if (-not [string]::IsNullOrWhiteSpace(($latestTagReference -join "`n"))) {
              git push origin --delete latest
              if ($LASTEXITCODE -ne 0) {
                throw 'Failed to delete the orphan latest tag.'
              }
            }
          }

          gh release create latest "$env:ASSET_PATH" "$env:CHECKSUM_PATH" `
            --target "$env:GITHUB_SHA" `
            --title 'Latest Windows build' `
            --notes "Automated build from main commit $env:GITHUB_SHA." `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to create the latest release.'
          }
