name: Build versioned release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Serialize releases so two closely spaced pushes cannot publish out of order.
  group: versioned-release-main
  cancel-in-progress: false

jobs:
  build-and-release:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 8.0.x

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\CodingAgentAccountSwitcher.sln
          dotnet restore .\src\CodingAgentAccountSwitcher.App\CodingAgentAccountSwitcher.App.csproj `
            --runtime win-x64

      - name: Test
        run: dotnet test CodingAgentAccountSwitcher.sln --configuration Release --no-restore

      - name: Publish Windows x64
        shell: pwsh
        run: |
          dotnet publish .\src\CodingAgentAccountSwitcher.App\CodingAgentAccountSwitcher.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained true `
            --no-restore `
            --output .\artifacts\publish `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -p:DebugType=None `
            -p:DebugSymbols=false `
            "-p:Version=$env:APP_VERSION"

      - name: Prepare portable executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          Copy-Item -LiteralPath .\LICENSE -Destination .\artifacts\publish\LICENSE -Force
          Copy-Item -LiteralPath .\THIRD-PARTY-NOTICES.md -Destination .\artifacts\publish\THIRD-PARTY-NOTICES.md -Force
          Copy-Item -LiteralPath .\README.md -Destination .\artifacts\publish\README.md -Force
          $publishedExecutablePath = '.\artifacts\publish\CodingAgentAccountSwitcher.exe'
          if (-not (Test-Path -LiteralPath $publishedExecutablePath -PathType Leaf)) {
            throw 'The expected portable executable was not created.'
          }

          $assetName = "CAAS-v$($env:APP_VERSION)-Portable-x64.exe"
          $assetPath = Join-Path '.\artifacts' $assetName
          Copy-Item -LiteralPath $publishedExecutablePath -Destination $assetPath -Force
          if ((Get-Item -LiteralPath $assetPath).Length -le 0) {
            throw 'The portable executable is empty.'
          }

          $checksumPath = "$assetPath.sha256"
          $hash = (Get-FileHash -LiteralPath $assetPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$assetName" |
            Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Build per-user installer
        shell: pwsh
        run: |
          $compilerPath = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if ([string]::IsNullOrWhiteSpace($compilerPath)) {
            $compilerPath = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          }
          if (-not (Test-Path -LiteralPath $compilerPath -PathType Leaf)) {
            throw "Inno Setup compiler was not found at '$compilerPath'."
          }

          & $compilerPath "--define=AppVersion=$env:APP_VERSION" .\installer\CodingAgentAccountSwitcher.iss
          if ($LASTEXITCODE -ne 0) {
            throw 'Inno Setup failed to build the installer.'
          }

          $installerAssetName = "CAAS-v$($env:APP_VERSION)-Setup-x64.exe"
          $installerPath = Join-Path '.\artifacts' $installerAssetName
          if (-not (Test-Path -LiteralPath $installerPath -PathType Leaf)) {
            throw 'The expected installer artifact was not created.'
          }

          $checksumPath = "$installerPath.sha256"
          $hash = (Get-FileHash -LiteralPath $installerPath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *$installerAssetName" |
            Set-Content -LiteralPath $checksumPath -Encoding ascii

      - name: Smoke test installer and uninstaller
        shell: pwsh
        run: |
          $installerAssetName = "CAAS-v$($env:APP_VERSION)-Setup-x64.exe"
          $installerPath = (Resolve-Path (Join-Path '.\artifacts' $installerAssetName)).Path
          $installPath = Join-Path $env:RUNNER_TEMP 'coding-agent-account-switcher-install-smoke'
          $installedExePath = Join-Path $installPath 'CodingAgentAccountSwitcher.exe'
          $uninstallerPath = Join-Path $installPath 'unins000.exe'
          $programsPath = [Environment]::GetFolderPath([Environment+SpecialFolder]::Programs)
          $shortcutPath = Join-Path $programsPath 'Coding Agent Account Switcher.lnk'
          $userDataPath = Join-Path $env:LOCALAPPDATA 'CodingAgentAccountSwitcher'
          $sentinelPath = Join-Path $userDataPath 'installer-smoke-sentinel.txt'
          $runKeyPath = 'Software\Microsoft\Windows\CurrentVersion\Run'
          $startupValueName = 'CodingAgentAccountSwitcher'
          $expectedStartupCommand = '"' + $installedExePath + '"'

          function Invoke-CheckedProcess {
            param(
              [Parameter(Mandatory)] [string] $FilePath,
              [Parameter(Mandatory)] [string[]] $ArgumentList
            )

            $process = Start-Process `
              -FilePath $FilePath `
              -ArgumentList $ArgumentList `
              -WindowStyle Hidden `
              -Wait `
              -PassThru
            if ($process.ExitCode -ne 0) {
              throw "'$FilePath' exited with code $($process.ExitCode)."
            }
          }

          function Wait-ForInstalledExecutableRemoval {
            for ($attempt = 0; $attempt -lt 100; $attempt++) {
              if (-not (Test-Path -LiteralPath $installedExePath)) {
                return
              }
              Start-Sleep -Milliseconds 100
            }
            throw 'The installed executable remained after uninstall.'
          }

          New-Item -ItemType Directory -Force -Path $userDataPath | Out-Null
          Set-Content -LiteralPath $sentinelPath -Value 'preserve-on-uninstall' -Encoding ascii

          try {
            Invoke-CheckedProcess `
              -FilePath $installerPath `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installPath")

            if (-not (Test-Path -LiteralPath $installedExePath -PathType Leaf) -or
                -not (Test-Path -LiteralPath $uninstallerPath -PathType Leaf) -or
                -not (Test-Path -LiteralPath $shortcutPath -PathType Leaf)) {
              throw 'Installer smoke test did not create the expected application, uninstaller, and shortcut.'
            }

            $runKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($runKeyPath, $false)
            try {
              if ($null -ne $runKey -and $runKey.GetValueNames() -contains $startupValueName) {
                throw 'Installing the application unexpectedly enabled Start with Windows.'
              }
            }
            finally {
              if ($null -ne $runKey) { $runKey.Dispose() }
            }

            $runKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey($runKeyPath, $true)
            try {
              $runKey.SetValue(
                $startupValueName,
                $expectedStartupCommand,
                [Microsoft.Win32.RegistryValueKind]::String)
            }
            finally {
              $runKey.Dispose()
            }

            Invoke-CheckedProcess `
              -FilePath $uninstallerPath `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            Wait-ForInstalledExecutableRemoval

            $runKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($runKeyPath, $false)
            try {
              if ($null -ne $runKey -and $runKey.GetValueNames() -contains $startupValueName) {
                throw 'Uninstall did not remove the exact owned startup value.'
              }
            }
            finally {
              if ($null -ne $runKey) { $runKey.Dispose() }
            }
            if (-not (Test-Path -LiteralPath $sentinelPath -PathType Leaf)) {
              throw 'Uninstall removed application user data.'
            }

            Invoke-CheckedProcess `
              -FilePath $installerPath `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$installPath")

            $runKey = [Microsoft.Win32.Registry]::CurrentUser.CreateSubKey($runKeyPath, $true)
            try {
              # The same command with REG_EXPAND_SZ is deliberately unowned and must survive uninstall.
              $runKey.SetValue(
                $startupValueName,
                $expectedStartupCommand,
                [Microsoft.Win32.RegistryValueKind]::ExpandString)
            }
            finally {
              $runKey.Dispose()
            }

            Invoke-CheckedProcess `
              -FilePath $uninstallerPath `
              -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART')
            Wait-ForInstalledExecutableRemoval

            $runKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($runKeyPath, $false)
            try {
              $rawValue = $runKey.GetValue(
                $startupValueName,
                $null,
                [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
              if ($runKey.GetValueKind($startupValueName) -ne
                    [Microsoft.Win32.RegistryValueKind]::ExpandString -or
                  $rawValue -cne $expectedStartupCommand) {
                throw 'Uninstall changed an unowned startup value.'
              }
            }
            finally {
              $runKey.Dispose()
            }
            if (-not (Test-Path -LiteralPath $sentinelPath -PathType Leaf)) {
              throw 'Repeated uninstall removed application user data.'
            }
          }
          finally {
            $runKey = [Microsoft.Win32.Registry]::CurrentUser.OpenSubKey($runKeyPath, $true)
            try {
              if ($null -ne $runKey -and $runKey.GetValueNames() -contains $startupValueName) {
                $rawValue = $runKey.GetValue(
                  $startupValueName,
                  $null,
                  [Microsoft.Win32.RegistryValueOptions]::DoNotExpandEnvironmentNames)
                if ($rawValue -ceq $expectedStartupCommand) {
                  $runKey.DeleteValue($startupValueName, $false)
                }
              }
            }
            finally {
              if ($null -ne $runKey) { $runKey.Dispose() }
            }
            if (Test-Path -LiteralPath $sentinelPath) {
              Remove-Item -LiteralPath $sentinelPath -Force
            }
          }

      - name: Publish versioned release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $releaseTag = "v$env:APP_VERSION"
          $installerAssetName = "CAAS-v$($env:APP_VERSION)-Setup-x64.exe"
          $portableAssetName = "CAAS-v$($env:APP_VERSION)-Portable-x64.exe"
          $installerPath = Join-Path '.\artifacts' $installerAssetName
          $portablePath = Join-Path '.\artifacts' $portableAssetName
          $versionMarker = "<!-- coding-agent-account-switcher-version: $env:APP_VERSION -->"
          $releaseNotes = "Automated Windows build for version $env:APP_VERSION from main commit $env:GITHUB_SHA. Includes a per-user installer, a portable executable, and SHA-256 checksums. Third-party notices are documented in the project README: https://github.com/$env:GITHUB_REPOSITORY/blob/$env:GITHUB_SHA/README.md#third-party-notices.`n`n$versionMarker"

          gh release create "$releaseTag" `
            "$installerPath" `
            "$installerPath.sha256" `
            "$portablePath" `
            "$portablePath.sha256" `
            --target "$env:GITHUB_SHA" `
            --title "$releaseTag" `
            --notes "$releaseNotes" `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to create release '$releaseTag'."
          }

      - name: Remove assets from older releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the versioned Release records and tags, but remove every uploaded
          # binary from older Releases after the new download is safely available.
          $releaseTag = "v$env:APP_VERSION"
          $apiVersionHeader = 'X-GitHub-Api-Version: 2026-03-10'
          $releasePagesJson = gh api `
            --paginate `
            --slurp `
            --header "$apiVersionHeader" `
            "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to list Releases for old-asset cleanup.'
          }

          $releasePages = @(($releasePagesJson -join "`n") | ConvertFrom-Json)
          foreach ($releasePage in $releasePages) {
            foreach ($release in @($releasePage)) {
              if ($release.tag_name -ceq $releaseTag) {
                continue
              }

              $assetPagesJson = gh api `
                --paginate `
                --slurp `
                --header "$apiVersionHeader" `
                "repos/$env:GITHUB_REPOSITORY/releases/$($release.id)/assets?per_page=100"
              if ($LASTEXITCODE -ne 0) {
                throw "Failed to list assets for Release '$($release.tag_name)'."
              }

              $assetPages = @(($assetPagesJson -join "`n") | ConvertFrom-Json)
              foreach ($assetPage in $assetPages) {
                foreach ($asset in @($assetPage)) {
                  gh api `
                    --method DELETE `
                    --header "$apiVersionHeader" `
                    "repos/$env:GITHUB_REPOSITORY/releases/assets/$($asset.id)"
                  if ($LASTEXITCODE -ne 0) {
                    throw "Failed to delete asset '$($asset.name)' from Release '$($release.tag_name)'."
                  }
                }
              }
            }
          }
